# thuammai Postgres (spec §4.4). The container is limited to 1 GiB on a shared host.
listen_addresses = '*'
max_connections = 30
shared_buffers = 256MB
effective_cache_size = 640MB
work_mem = 8MB
maintenance_work_mem = 64MB
dynamic_shared_memory_type = posix
timezone = 'UTC'
log_timezone = 'UTC'
log_line_prefix = '%m [%p] '
log_min_duration_statement = 2000
# Never log parameter values: they are endpoints, chat ids and labels (spec §7.4).
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_statement = 'none'
