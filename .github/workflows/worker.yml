name: worker
on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/core/**', 'static/provinces.json']
  workflow_dispatch:
permissions: {}
concurrency:
  group: worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    # Does nothing until the owner has created the D1 database (docs: owner setup, step 2).
    if: ${{ vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: node worker/make-config.mjs "$D1_DATABASE_ID"
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      # Migrations only ever add (spec §11); they run before the code that needs them.
      - run: npx wrangler@4.143.0 d1 migrations apply thuammai-alerts --remote -c worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - run: npx wrangler@4.143.0 deploy -c worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - if: ${{ vars.ALERTS_ORIGIN != '' }}
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$ALERTS_ORIGIN/v1/health"
        env:
          ALERTS_ORIGIN: ${{ vars.ALERTS_ORIGIN }}
