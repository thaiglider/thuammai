name: pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'   # watchdog; the dispatch chain below is the main 10-minute loop
  push:
    branches: [main]
permissions: {}
env:
  SITE_URL: https://thaiglider.github.io/thuammai
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            active=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --limit 20 --json databaseId,status \
              --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\") and .databaseId != $GITHUB_RUN_ID)] | length")
            if [ "$active" != "0" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  build:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Public values only (never secrets): the Worker origin is baked in only while alerts are on.
      - run: npm run build
        env:
          VITE_ALERTS_ORIGIN: ${{ vars.ALERTS_ENABLED == '1' && vars.ALERTS_ORIGIN || '' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
      - uses: actions/cache/restore@v4
        with:
          path: .cache/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      # Best effort: a missing Release, API hiccup or slow download must never stop a deploy
      # (the pipeline then republishes the skill.json already on the site, or none).
      - name: Latest skill.json from the newest archive Release
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '[.[].tagName | select(startswith("archive-"))] | sort | last // empty')
          if [ -n "$tag" ]; then
            gh release download "$tag" -R "$GITHUB_REPOSITORY" -p skill.json -D .cache/skill --clobber
          else
            echo "no archive release yet"
          fi
      - run: npm run pipeline -- --out dist --state .cache/state.json --site "$SITE_URL" --skill .cache/skill/skill.json
      # The exact data/ this run deploys, for the alerts job (never the Pages cache).
      - uses: actions/upload-artifact@v4
        with: { name: snapshot, path: dist/data, retention-days: 1, if-no-files-found: error }
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v4
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
  # The only job that can read the alert secrets (in its last step only). Slow or failing alerts
  # never delay the 10-minute chain or the deploy: `next` does not wait for this job.
  alerts:
    needs: [gate, build]
    if: ${{ needs.build.result == 'success' && vars.ALERTS_ENABLED == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    concurrency:
      group: alerts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: snapshot, path: .cache/snapshot }
      - run: npm run alerts -- --data .cache/snapshot
        env:
          ALERTS_ORIGIN: ${{ vars.ALERTS_ORIGIN }}
          ALERTS_API_TOKEN: ${{ secrets.ALERTS_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
  next:
    needs: [gate, build]
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          elapsed=$(( $(date +%s) - $(date -d "$started" +%s) ))
          if [ $elapsed -lt 600 ]; then sleep $(( 600 - elapsed )); fi
          others=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pipeline.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select((.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .status==\"requested\") and .databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$others" = "0" ]; then gh workflow run pipeline.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "another run active ($others); not dispatching"; fi
